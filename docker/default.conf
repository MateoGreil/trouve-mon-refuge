server {
    listen      80;
    listen      [::]:80;
    server_name _;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    location = /data/refuges.json {
        root       /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=3600";
    }
}
